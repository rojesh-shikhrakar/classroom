<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Classroom favicon</title>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1F4B99"/>

  <!-- Classroom board -->
  <rect x="10" y="10" width="44" height="25" rx="3" fill="#FFFFFF"/>
  <rect x="14" y="14" width="36" height="17" rx="1.5" fill="#1F4B99"/>

  <!-- Teacher -->
  <circle cx="32" cy="40" r="4" fill="#FFFFFF"/>
  <path d="M25 53c0-5 3-9 7-9s7 4 7 9v2H25z" fill="#FFFFFF"/>

  <!-- Student desks -->
  <rect x="9" y="47" width="12" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="43" y="47" width="12" height="6" rx="2" fill="#FFFFFF"/>

  <!-- Board stand -->
  <rect x="14" y="35" width="3" height="8" rx="1.5" fill="#FFFFFF"/>
  <rect x="47" y="35" width="3" height="8" rx="1.5" fill="#FFFFFF"/>
</svg>
